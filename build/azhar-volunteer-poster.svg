<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title description">
  <title id="title">Volunteer for Azhar Shafi</title>
  <desc id="description">Volunteers collect cash, deposit it into their own bank account, then transfer the total by NEFT to one of three listed accounts. UPI and GPay are inactive as of 24 Oct 2026, 12 PM.</desc>
